# Porteiro das regras do projeto: formatação, arquitetura, testes e build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android, lint e arquitetura
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Mesmo JDK do daemon (gradle/gradle-daemon-jvm.properties: Azul 21), sem download extra.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Spotless, Konsist, testes e build
        run: >
          ./gradlew
          spotlessCheck
          :konsist:test
          testAndroidHostTest
          :androidApp:assembleDebug
          :wearApp:assembleDebug
          --continue

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  device:
    name: Android (emulador)
    # Sobe um emulador a cada execução: só em PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Sem KVM o emulador não tem aceleração no runner Linux.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # O emulador confere o disco livre antes de subir e aborta se faltar ("not enough disk space
      # to run avd"). O runner vem com toolchains que este projeto não usa.
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h / "$HOME"

      # Testes de UI em aparelho.
      - name: Testes em aparelho
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          # Partição de dados enxuta: os APKs de teste são pequenos e o disco do runner é curto.
          disk-size: 4096M
          disable-animations: true
          script: ./gradlew connectedAndroidDeviceTest --continue

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: "**/build/reports/androidTests/"
          if-no-files-found: ignore

  ios:
    name: iOS (simulador)
    # Minuto de runner macOS custa mais: só em PR.
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Toolchain e dependências do Kotlin/Native (~1 GB). Muda junto com as versões do catálogo.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Testes iOS
        run: ./gradlew iosSimulatorArm64Test --continue

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
